        function animateNumber(el, target, duration = 2000) {
            let start = 0;
            let startTime = null;
            if (el.dataset.target) {
                target = parseInt(el.dataset.target.replace(/\D/g, ''));
            } else {
                target = parseInt(target.replace(/\D/g, ''));
            }
            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = Math.min((timestamp - startTime) / duration, 1);
                el.textContent = Math.floor(progress * target).toLocaleString() + (el.dataset.plus ? el.dataset.plus : '');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    el.textContent = target.toLocaleString() + (el.dataset.plus ? el.dataset.plus : '');
                }
            }
            window.requestAnimationFrame(step);
        }

        function isInViewport(el) {
            const rect = el.getBoundingClientRect();
            return (
                rect.top < window.innerHeight &&
                rect.bottom > 0
            );
        }

        function handleNumbers() {
            document.querySelectorAll('.number').forEach(function(el) {
                if (!el.classList.contains('animated') && isInViewport(el)) {
                    el.classList.add('animated');
                    let plus = '';
                    if (el.dataset.target && el.dataset.target.trim().endsWith('+')) {
                        plus = '+';
                    } else if (el.textContent.trim().endsWith('+')) {
                        plus = '+';
                    }
                    el.dataset.plus = plus;
                    setTimeout(function() {
                        animateNumber(el, el.dataset.target || el.textContent.trim(), 1500);
                    });
                }
            });
        }
